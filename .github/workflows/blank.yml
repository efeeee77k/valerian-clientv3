name: Build JAR
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: |
          ls -la
          f="$(ls valerian-src*.zip | tail -n 1)"
          echo "Kullanilan zip: $f"
          unzip -oq "$f" -d /tmp/new
          rm -rf src
          cp -r /tmp/new/src ./src
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: valerian-jar
          path: build/libs/valerian-1.0.0.jar
